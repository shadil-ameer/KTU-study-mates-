<body>
{% extends 'Admin/adminhome.html'%}
{% block body %}
<body><form id="form1" name="form1" enctype="multipart/form-data" method="post" action="/myapp/mentoredit_post/">
    {% csrf_token %}
<h1>mentor edit</h1>
  <table width="200" border="1">
    <tr>
      <td>Name</td><input type="hidden" name="id" value="{{ data.LOGIN_id }}">
      <td><label for="textfield"></label>
      <input type="text" name="textfield" value="{{ data.name }}" id="textfield" /></td>
    </tr>
    <tr>
      <td>Email</td>
      <td><label for="textfield2"></label>
      <input type="email" name="textfield2" value="{{ data.email }}" id="textfield2" /></td>
    </tr>
    <tr>
      <td>DOB</td>
      <td><label for="textfield3"></label>
      <input type="date" name="textfield3" value="{{ data.dob |date:'Y-m-d' }}" id="textfield3" /></td>
    </tr>
    <tr><td>Photo</td>
    <td><img src="{{ data.photo }} " width="100" height="100"><br>
        <input name="photo"  type="file" /></td></tr>
   <tr><td>Video</td>
    <td><video height="100px" width="150px" controls><source src="{{ data.video}}"></video>
        <input name="Video"  type="file" /></td></tr>

      <tr><td>GENDER<td><p>
     <label>
       <input type="radio" {% if data.gender == "Female" %}checked{% endif %} name="RadioGroup1" value="Female" id="RadioGroup1_0" />
       Female
     </label>
     <br />
     <label>
       <input type="radio" {% if data.gender == "Male" %}checked{% endif %} name="RadioGroup1" value="Male" id="RadioGroup1_1" />
       Male</label>
       </tr>
    <tr>
      <td>Phone</td>
      <td><label for="textfield4"></label>
      <input type="tel" name="textfield4" value="{{ data.phone }}" id="textfield4" /></td>
    </tr>
    <tr>
      <td>Place</td>
      <td><label for="textfield5"></label>
      <input type="text" name="textfield5" value="{{ data.place }}" id="textfield5" /></td>
    </tr>
    <tr>
      <td>District</td>
      <td><label for="textfield6"></label>
      <input type="text" name="textfield6" value="{{ data.district }}" id="textfield6" /></td>
    </tr>
    <tr>
      <td>Pin</td>
      <td><label for="textfield7"></label>
      <input type="text" name="textfield7" value="{{ data.pin }}" id="textfield7" /></td>
    </tr>
      <tr>
       <td>Qualification</td>
      <td><label for="textfield8"></label>
      <input type="text" name="textfield8" value="{{ data.qualification }}" id="textfield8" /></td>
      </tr>
    <tr>
      <td>&nbsp;</td>
      <td><input name="button" type="submit" id="button" value="Update" /></td>
    </tr>
   
  </table>
</form>
</body>
{#</html>#}
{% endblock %}
