<body>
{% extends 'Admin/adminhome.html'%}
{% block body %}
<body><form action="/myapp/feedbackview_post/" method="post">
{% csrf_token %}
<table border="1px">
        <tr>
            <td><label>FROM DATE:</label></td>
            <td><input type="date" name="fromdate"/></td>
            <td><label>TO DATE:</label></td>
            <td><input type="date" name="todate"/></td>
            <td><input type="submit" value="Search"/></td>
        </tr>
    </table>
    <table width="321" border="1">

    <tr>
    <td width="39">SNO</td>
    <td width="49">DATE</td>
    <td width="103">FEEDBACK</td>
    <td width="119">STUDENT</td>
  </tr>
    {% for i in data %}
  <tr>
    <td>{{ forloop.counter }}</td>
    <td>{{ i.date }}</td>
    <td>{{ i.feedback }}</td>
    <td>{{ i.STUDENT.name }}</td>
  </tr>
     {% endfor %}
</table>
</form>
</body>

{% endblock %}
